; TRIGGER 4 Plus — AtomS3 standalone status display
;
; Native ESP-IDF firmware that connects to a TRIGGER ACS Plus 4-channel BLE
; relay and shows channel state (ON/OFF/BLINK) + dim level on the AtomS3's
; 0.85" 128x128 panel. No Home Assistant dependency; no Wi-Fi.
;
; Protocol implemented per the parent repo's README.md / BLE_PROTOCOL.md:
;   service       0xFFF0
;   write char    0xFFF6 (Write Without Response only — opcode 0x52)
;   notify char   0xFFF7 (5-byte state frames)
;   keepalive     74 88 <id> 00 00 DE <pwd_hi> <pwd_lo>  every ~200 ms
;
; UI uses M5GFX (LovyanGFX-based) — same recipe as
;   ../M5StickCPlus2_Remote_For_DJI_Osmo
; so font + color paths are consistent across the two AtomS3 builds.

[platformio]
src_dir = main

; Pin to platform-espressif32 ~6.11.0 (last release on the IDF 5.5 line) for
; parity with the DJI-remote project. Newer 7.x ships ESP-IDF 6.x and breaks
; the sdkconfig snapshot; regenerate via menuconfig if you bump this.
[platform_pins]
platform = espressif32 @ ~6.11.0

[env:m5atoms3]
platform = ${platform_pins.platform}
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before
    no_reset
    --after
    hard_reset
board_build.cmake_extra_args = -DM5ATOMS3_BUILD=ON
board_build.sdkconfig_defaults = sdkconfig.defaults.m5atoms3
board_build.flash_mode = qio
lib_deps =
    m5stack/M5GFX@^0.2.6
